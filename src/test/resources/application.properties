spring.application.id=@project.artifactId@
spring.application.version=@project.version@
spring.application.name=@project.name@
spring.application.log.dir=${logDir:/log}
spring.banner.location=classpath:banner.txt
spring.output.ansi.enabled=ALWAYS

# Configuração da conexão com o banco de dados
spring.datasource.url=jdbc:mysql://projetoalura.c6vec84gux5k.us-east-1.rds.amazonaws.com:3306/projetoalura
spring.datasource.username=${dbUser}
spring.datasource.password=${dbPassword}

# Desabilitar a criação/atualização automática de tabelas pelo Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Configurações opcionais para exibição de SQL e dialeto do banco de dados
spring.jpa.show-sql=false
spring.flyway.validate-on-migrate=false

# Additional Configurations
spring.threads.virtual.enabled=true