spring.application.id=@project.artifactId@
spring.application.version=@project.version@
spring.application.name=@project.name@
spring.application.log.dir=${log-dir}
spring.banner.location=classpath:banner.txt
spring.output.ansi.enabled=ALWAYS

# Configuração da conexão com o banco de dados
spring.datasource.url=jdbc:mysql://localhost:3306/projetoalura?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=${db-user}
spring.datasource.password=${db-password}

# Desabilitar a criação/atualização automática de tabelas pelo Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Configurações opcionais para exibição de SQL e dialeto do banco de dados
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.flyway.validate-on-migrate=false

# Opções do MVC
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Additional Configurations
spring.threads.virtual.enabled=true